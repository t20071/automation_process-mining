[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "process-agent"
version = "0.2.0"
description = "Process intelligence + governed agentic automation: mine event logs, find bottlenecks, quantify ROI, gate every AI action."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.57.0",
    "pandas>=2.2.0",
    "networkx>=3.3",
    "altair>=5.4.0",
    "groq>=0.9.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # long lines are left to the formatter
    "UP017",  # keep timezone.utc — datetime.UTC needs Python 3.11+
    "UP042",  # keep (str, Enum) — StrEnum needs Python 3.11+
]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402"]          # page config must run before other imports
"tests/conftest.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]
